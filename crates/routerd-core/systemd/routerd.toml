# /etc/syntrop/routerd.toml
# Systemd routerd configuration template

[daemon]
listen_tcp = "127.0.0.1:32768"
listen_unix = "/run/syntrop/router.sock"
varlink_socket = "/run/syntrop/io.syntrop.Router1"
inferenced_socket = "/run/syntrop/io.syntrop.Inference1"
log_level = "info"

[thresholds]
max_latency_ms = 15000
psi_memory_threshold = 25.0
max_retries = 2
rss_limit_mb = 15
min_tokens_per_second = 10.0

[tiers.fast]
name = "fast"
latency_weight = 0.60
cost_weight = 0.30
capability_weight = 0.10
# default_model: unset — scoring decides. Set via `routerctl default <model>`.

[tiers.hard]
name = "hard"
latency_weight = 0.15
cost_weight = 0.15
capability_weight = 0.70
# default_model: unset — scoring decides. Set via `routerctl default <model>`.

# --- Provider Definitions (local-only) ---
# Cloud providers were removed; the daemon refuses non-local entries.
# Restore: re-add a [[providers]] block and re-run setup.

# 1. Remote LAN Ollama Node 1
[[providers]]
id = "ollama-lan-1"
name = "Local LAN Inference Worker 1"
kind = "ollama"
base_url = "http://192.168.1.100:11434"
tier = "fast"
weight = 1.1
enabled = false
timeout_ms = 20000

[[providers.models]]
name = "qwen2.5-coder:7b"
max_context_tokens = 32768
cost_per_input_token = 0.0
cost_per_output_token = 0.0
avg_latency_ms = 95.0
tokens_per_second = 110.0
tier = "fast"

# 2. Remote LAN Ollama Node 2
[[providers]]
id = "ollama-lan-2"
name = "Local LAN Inference Worker 2"
kind = "ollama"
base_url = "http://192.168.1.101:11434"
tier = "hard"
weight = 1.1
enabled = false
timeout_ms = 45000

[[providers.models]]
name = "deepseek-r1:32b"
max_context_tokens = 65536
cost_per_input_token = 0.0
cost_per_output_token = 0.0
avg_latency_ms = 280.0
tokens_per_second = 45.0
tier = "hard"

# 3. Local syntrop Varlink Bridge (Hardware Accelerated)
[[providers]]
id = "syntrop-local"
name = "Syntrop Local Inferenced Broker"
kind = "varlink"
base_url = "/run/syntrop/io.syntrop.Inference1"
tier = "fast"
weight = 1.3
enabled = false
timeout_ms = 10000

[[providers.models]]
name = "syntrop-local-qwen"
max_context_tokens = 16384
cost_per_input_token = 0.0
cost_per_output_token = 0.0
avg_latency_ms = 40.0
tokens_per_second = 300.0
tier = "fast"
