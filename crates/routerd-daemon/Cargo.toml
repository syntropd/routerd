[package]
name = "syntrop-routerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/syntropd/routerd"
description = "Intelligent model router, difficulty-tier evaluation, and wire protocol gateway daemon for syntropd"

[[bin]]
name = "routerd"
path = "src/main.rs"

[dependencies]
routerd-core = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
