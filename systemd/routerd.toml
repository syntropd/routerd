# /etc/syntrop/routerd.toml
# Systemd routerd configuration template

[daemon]
listen_tcp = "127.0.0.1:32768"
listen_unix = "/run/syntrop/router.sock"
varlink_socket = "/run/syntrop/io.syntrop.Router1"
inferenced_socket = "/run/syntrop/io.syntrop.Inference1"
log_level = "info"

[thresholds]
max_latency_ms = 15000
psi_memory_threshold = 25.0
max_retries = 2
rss_limit_mb = 15
min_tokens_per_second = 10.0

[tiers.fast]
name = "fast"
latency_weight = 0.60
cost_weight = 0.30
capability_weight = 0.10
default_model = "llama-3.3-70b-versatile"

[tiers.hard]
name = "hard"
latency_weight = 0.15
cost_weight = 0.15
capability_weight = 0.70
default_model = "deepseek-chat"

# --- Provider Definitions ---

# 1. MiniMax Cloud Provider
[[providers]]
id = "minimax"
name = "MiniMax AI Cloud"
kind = "minimax"
base_url = "https://api.minimaxi.chat/v1"
api_key = "cred:minimax_api_key"
tier = "hard"
weight = 1.0
enabled = true
timeout_ms = 30000

[[providers.models]]
name = "abab6.5s-chat"
max_context_tokens = 245760
cost_per_input_token = 0.000001
cost_per_output_token = 0.000001
